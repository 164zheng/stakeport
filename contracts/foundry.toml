[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Prague: EIP-7702 (set-code tx), EIP-7251 consolidation predeploy, EIP-4788 beacon roots
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# drop the metadata hash so the official SwapVMRouter v1.0.2 fits the EIP-170 size limit
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 100
