[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Prague: EIP-7702 (set-code tx), EIP-7251 consolidation predeploy, EIP-4788 beacon roots
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 100
